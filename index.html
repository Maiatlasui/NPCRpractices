<script>
// The exported game stores progress in this browser, for this page path.
(() => {
  const key = 'character-detectives-v3:' + window.location.pathname;
  let saved = null;
  try {
    saved = JSON.parse(window.localStorage.getItem(key) || 'null');
  } catch (_) {}
  window.openai = {
    widgetState: saved,
    setWidgetState(next) {
      this.widgetState = next;
      try {
        window.localStorage.setItem(key, JSON.stringify(next));
        return Promise.resolve();
      } catch (error) {
        return Promise.reject(error);
      }
    }
  };
})();
</script>

  root.innerHTML=`<header class="cd-head"><div class="cd-seal" lang="zh-Hans" aria-hidden="true">字</div><div><h1 class="cd-title">Character Detectives</h1><div class="cd-sub">汉字侦探 · ${allCharacters.length} characters · Beginner 1 · Beginner 2 · Intermediate 1</div></div></header><div class="cd-layout"><nav class="cd-side" aria-label="Choose a chapter"><div class="cd-course-picker"><label for="cd-course">Course</label><select id="cd-course">${courseUnits.map(c=>`<option value="${c.id}" ${c.id===state.course?'selected':''}>${c.title}</option>`).join('')}</select></div><div class="cd-eyebrow">Your case files</div>${chapters.map((ch,i)=>{if(i!==revisionChapter&&!course().numbers.includes(lessonNumbers[i]))return '';const ps=i===revisionChapter?[packById[course().revision]]:allPacks.filter(p=>p.lesson===i),chars=unique(ps.flatMap(p=>p.characters));return `<button type="button" class="cd-chapter cursor-interaction" data-chapter="${i}" aria-pressed="${state.chapter===i}"><span class="cd-chapter-number">${i===revisionChapter?'R':String(lessonNumbers[i]).padStart(2,'0')}</span><span><span class="cd-chapter-name">${ch.title}</span><span class="cd-chapter-detail">${chars.length} characters · ${ps.reduce((n,p)=>n+p.questions.length,0)} clues</span></span></button>`;}).join('')}<div class="cd-note">Short rounds.<br>Every character included.<br><br>Core, bonus and names.<br>No timer.</div></nav><main class="cd-main"><div class="cd-setbar"><label for="cd-pack">Practice set</label><select id="cd-pack" class="cursor-interaction">${chapterPacks.map(p2=>`<option value="${p2.id}" ${p2.id===p.id?'selected':''}>${esc(p2.type)} · ${esc(p2.title)} (${p2.questions.length} clues)</option>`).join('')}</select><button type="button" class="cd-coverage-toggle cursor-interaction" data-coverage aria-expanded="${state.coverage}">${state.coverage?'Back to practice':'Vocabulary & coverage'}</button></div><div class="cd-status"><span>${state.coverage?`${expected.filter(c=>seen.has(c)).length} / ${expected.length} characters practised`:`${attempted} / ${p.questions.length} clues explored`}</span><span>${stars(r)} ${stars(r)===1?'star':'stars'}</span></div><div class="cd-progress" role="progressbar" aria-label="Practice set progress" aria-valuenow="${attempted}" aria-valuemin="0" aria-valuemax="${p.questions.length}"><span style="width:${attempted/p.questions.length*100}%"></span></div>${state.coverage?coverageView():!entry.q?finished(p,r):r.pause?checkpoint(p,r):questionView(p,r,entry)}</main></div>`;
  root.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const i=+b.dataset.chapter;switchPack(i===revisionChapter?course().revision:state.last[i]);});
  root.querySelector('#cd-course').onchange=e=>{const c=courseUnits.find(c=>c.id===e.target.value);switchPack(state.last[lessonNumbers.indexOf(c.numbers[0])]);};
  root.querySelector('#cd-pack').onchange=e=>switchPack(e.target.value);
  root.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>switchPack(b.dataset.pack));
  root.querySelector('[data-coverage]').onclick=()=>{state.coverage=!state.coverage;render();save();};
  root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(r.checked)return;r.selected=b.dataset.answer;r.checked=true;const ok=r.selected===entry.q.answer;setMark(r,entry.index,entry.review?(ok?'3':'4'):(ok?'1':'2'));if(!ok&&!entry.review)r.pending.push(entry.index);render();save();root.querySelector('[data-next]')?.focus({preventScroll:true});});
  root.querySelector('[data-hint]')?.addEventListener('click',()=>{r.hint=!r.hint;render();save();root.querySelector('[data-hint]')?.focus({preventScroll:true});});
  root.querySelector('[data-next]')?.addEventListener('click',()=>{if(entry.review)r.pending.shift();else r.at++;r.selected='';r.checked=false;r.hint=false;if(!entry.review&&r.at>0&&r.at%10===0&&r.at<p.questions.length)r.pause=true;render();save();});
  root.querySelector('[data-continue]')?.addEventListener('click',()=>{r.pause=false;render();save();});
  root.querySelector('[data-restart]')?.addEventListener('click',()=>{state.runs[p.id]=freshRun();render();save();});
  root.querySelector('[data-next-chapter]')?.addEventListener('click',()=>{if(state.chapter===revisionChapter)switchPack(state.last[lessonNumbers.indexOf(course().numbers[0])]);else if(state.chapter+1===revisionChapter)switchPack(course().revision);else switchPack(state.last[state.chapter+1]);});
}
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming?.privateContent?.game?.v===version&&JSON.stringify(incoming.privateContent.game)!==JSON.stringify(state)){state=restore(incoming);render();}});
render();

})();
</script>
</body>
