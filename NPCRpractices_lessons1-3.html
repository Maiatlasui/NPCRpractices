<script>
// The exported game stores progress in this browser, for this page path.
(() => {
  const key = 'character-detectives-v3:' + window.location.pathname;
  let saved = null;
  try {
    saved = JSON.parse(window.localStorage.getItem(key) || 'null');
  } catch (_) {}
  window.openai = {
    widgetState: saved,
    setWidgetState(next) {
      this.widgetState = next;
      try {
        window.localStorage.setItem(key, JSON.stringify(next));
        return Promise.resolve();
      } catch (error) {
        return Promise.reject(error);
      }
    }
  };
})();
</script>

  root.querySelector('[data-next]')?.addEventListener('click',()=>{if(entry.review)r.pending.shift();else r.at++;r.selected='';r.checked=false;r.hint=false;if(!entry.review&&r.at>0&&r.at%10===0&&r.at<p.questions.length)r.pause=true;render();save();});
  root.querySelector('[data-continue]')?.addEventListener('click',()=>{r.pause=false;render();save();});
  root.querySelector('[data-restart]')?.addEventListener('click',()=>{state.runs[p.id]=freshRun();render();save();});
  root.querySelector('[data-next-chapter]')?.addEventListener('click',()=>switchPack(state.last[(state.chapter+1)%4]));
}
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming?.privateContent?.game?.v===version&&JSON.stringify(incoming.privateContent.game)!==JSON.stringify(state)){state=restore(incoming);render();}});
render();

})();
</script>
</body>
</html>
